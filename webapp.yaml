```yaml
# ---------------------------------------------------------
# 1. ConfigMap: Website HTML
# ---------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Penguin Technology</title>
    </head>
    <body>
      <h1>Hello webapp</h1>
      <p>Welcome to Penguin Technology</p>
      <p>NGINX Ingress and Kubernetes are working.</p>
    </body>
    </html>

---
# ---------------------------------------------------------
# 2. Deployment: NGINX Web Server
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: webapp-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: webapp-html
          configMap:
            name: webapp-html

---
# ---------------------------------------------------------
# 3. Service: Internal Access to NGINX Pods
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# ---------------------------------------------------------
# 4. ClusterIssuer: Let's Encrypt Production
# cert-manager must already be installed.
# Replace the email with your real email address.
# ---------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: YOUR_REAL_EMAIL@example.org
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

---
# ---------------------------------------------------------
# 5. Ingress: Domain Routing and HTTPS
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - web.penguin-technology.com
      secretName: webapp-tls
  rules:
    - host: web.penguin-technology.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-service
                port:
                  number: 80
```